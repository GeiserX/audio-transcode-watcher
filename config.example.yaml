# Audio Transcode Watcher Configuration (0.7.0)
# ======================================
#
# This configuration file defines the source folder and output destinations
# for automatic audio transcoding.
#
# Mount this file into the container and set CONFIG_FILE=/app/config.yaml

# Source folder containing original audio files (FLAC, WAV, etc.)
# Lossy sources (mp3, m4a, aac, ogg, opus, wma) are copied unchanged into
# lossless outputs, and into lossy outputs of the same codec; they are only
# transcoded into a lossy output of another codec.
source:
  path: /music/flac

# Output destinations - define as many as you need
outputs:
  # Lossless ALAC for Apple devices
  - name: alac
    codec: alac
    path: /music/alac
    include_artwork: true
  
  # MP3 256kbps for broad compatibility
  - name: mp3-256
    codec: mp3
    bitrate: 256k
    path: /music/mp3
    include_artwork: true
  
  # AAC 256kbps for phones, AirPods and CarPlay
  - name: aac-256
    codec: aac
    bitrate: 256k
    path: /music/aac
    include_artwork: true
    # Portable limits. These are the AAC defaults, shown for reference:
    # more than 2 channels are downmixed to stereo, and rates above 48 kHz
    # drop to 44.1 kHz (88.2/176.4 kHz sources) or 48 kHz (96/192 kHz).
    # Lower rates are never upsampled. Any codec can opt in; 0 = no limit.
    channels: 2
    max_sample_rate: 48000

# Even volume across the library (default: false). Every source without a
# REPLAYGAIN_TRACK_GAIN tag is measured (EBU R128) and gets ReplayGain 2.0
# track gain and peak tags, written into the source file itself. Every output
# gets the same tags, without being re-encoded. No album gain is written.
replaygain: false

# Optional settings
settings:
  # Set to true to delete all outputs and re-encode everything on startup
  force_reencode: false
  
  # Number of parallel encoding workers (default: 4)
  # Increase for faster bulk encoding on multi-core systems
  parallel_workers: 4
  
  # Maximum time to wait for a file to become stable (seconds)
  stability_timeout: 60
  
  # Minimum time a file must be unchanged before processing (seconds)
  min_stable_seconds: 1.0

  # Fetch synced .lrc lyrics online; nothing is written when none are found
  fetch_lyrics: true

  # Seconds between periodic full syncs (default: 300)
  sync_interval_seconds: 300

  # A source that does not decode cleanly (a damaged FLAC):
  #   skip           write nothing for it (default)
  #   encode_anyway  log the error, then encode it with FFmpeg's error
  #                  concealment, so a one-frame glitch is better than no copy
  # An output can set its own corrupt_source to override this.
  corrupt_source: skip

  # whisper_fallback and whisper_model were removed in 0.6.0 and are ignored


# ============================================================================
# SUPPORTED CODECS
# ============================================================================
#
# | Codec | Extension | Bitrate     | Artwork | Notes                        |
# |-------|-----------|-------------|---------|------------------------------|
# | alac  | .m4a      | N/A         | Yes     | Lossless, Apple compatible   |
# | aac   | .m4a      | 64k-320k    | Yes     | Lossy, great quality/size    |
# | mp3   | .mp3      | 64k-320k    | Yes     | Lossy, universal support     |
# | opus  | .opus     | 32k-256k    | No      | Lossy, best quality/size     |
# | flac  | .flac     | N/A         | Yes     | Lossless, open format        |
# | wav   | .wav      | N/A         | No      | Lossless, uncompressed       |
#
# Default bitrates: aac=256k, mp3=256k, opus=128k


# ============================================================================
# EXAMPLE: Multiple bitrate outputs
# ============================================================================
#
# outputs:
#   - name: mp3-320
#     codec: mp3
#     bitrate: 320k
#     path: /music/mp3-320
#   
#   - name: mp3-192
#     codec: mp3
#     bitrate: 192k
#     path: /music/mp3-192
#   
#   - name: mp3-128
#     codec: mp3
#     bitrate: 128k
#     path: /music/mp3-128
#     include_artwork: false  # Smaller files


# ============================================================================
# EXAMPLE: Minimal setup (single output)
# ============================================================================
#
# source:
#   path: /music/source
#
# outputs:
#   - name: compressed
#     codec: aac
#     bitrate: 192k
#     path: /music/compressed
